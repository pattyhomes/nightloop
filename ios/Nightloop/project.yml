name: Nightloop

options:
  bundleIdPrefix: com.nightloop
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk.git
    from: "9.2.0"

targets:
  Nightloop:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Nightloop/Sources
      - path: Nightloop/Resources
    configFiles:
      Debug: Config/NightloopConfig.xcconfig
      Release: Config/NightloopConfig.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightloop.app
        PRODUCT_NAME: Nightloop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: HFAR6K43RC
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Debug:
          INFOPLIST_FILE: Nightloop/Resources/Info-Debug.plist
          CODE_SIGN_ENTITLEMENTS: Nightloop/Resources/Nightloop.entitlements
          CODE_SIGN_STYLE: Automatic
        Release:
          INFOPLIST_FILE: Nightloop/Resources/Info-Release.plist
          CODE_SIGN_ENTITLEMENTS: Nightloop/Resources/Nightloop-Release.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Nightloop App Store
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleMaps
        product: GoogleMaps

  NightloopTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NightloopTests
    dependencies:
      - target: Nightloop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightloop.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nightloop:
    build:
      targets:
        Nightloop: all
        NightloopTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - NightloopTests
